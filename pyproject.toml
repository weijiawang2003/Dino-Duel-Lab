[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dino-duel-lab"
version = "1.3.0"
description = "Reproducible Dino duel self-play, PPO and action-conditioned latent prediction"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy==2.3.5"]
license = {text = "MIT"}

[project.optional-dependencies]
train = ["torch==2.10.0"]
test = ["pytest>=8,<10"]
upstream = ["gymnasium==1.0.0", "pygame==2.6.1", "Pillow==11.0.0"]

[project.scripts]
dino-duel = "dino_duel.cli:main"

[tool.setuptools.packages.find]
include = ["dino_duel*"]

[tool.setuptools.package-data]
dino_duel = ["data/configs/*.json", "data/assets/*.npz", "data/assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

